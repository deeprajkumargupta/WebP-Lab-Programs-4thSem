<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        body{
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card{
            background-color: rgb(246, 77, 77);
            width: 100%;
            max-width: 900px;
            border-radius: 20px;
            display: flex;
            flex-direction: row;
            flex:1;
            flex: 2;
            overflow: hidden;
            box-sizing: border-box;
        }
        .card:hover{
            box-shadow: 0px 0px 10px black;
            transition: 0.3s ease-in-out;
        }
        .left{
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .left p:nth-child(2){
            font-size: 120%;
            font-weight: 700;
        }
        .left p:nth-child(3){
            font-size: 100%;
        }
        .left img{
            width: 100%;
            max-width: 150px;
            height: auto;
            border-radius: 50%;
        }
        .right{
            flex: 2;
            background-color: rgb(229, 228, 228);
            padding: 5%;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        #name{
            font-size: 150%;
        }
        .rtop p{
            font-weight: 500;
            font-size: 21px;
        }
        .socials{
            display: flex;
            flex-direction: row;
            gap: 5px;
            justify-content: space-evenly;
        }
        .socials a{
            border: 1px solid black;
            padding: 5px 10px;
            border-radius: 10px;
            background-color: rgb(236, 89, 89);
            color: white;
            font-weight: 700;
            text-decoration: none;
        }
        .socials a:hover{
            background-color: rgb(209, 51, 51);
            transition:0.3s ease-in-out;
        }
        @media screen and (max-width: 768px) {
            .card {
                flex-direction: column;
                width: 100%;
                height: auto;
            }
            .right{
                align-items: center;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="left">
            <img src="profile.png" alt="profile" height="150" width="150">
            <p>Frontend Developer</p>
            <p>Building clean & responsive web experiences</p>
        </div>
        <div class="right">
            <div class="rtop">
                <h2 id="name">Deepraj Kumar Gupta</h2>
                <p>Aspiring Web Developer</p>
            </div>
            <div class="rbottom">
                <P id="website">www.yourwebsite.com</P>
                <p id="address">Street #, K R Puram, Bengaluru- 560036, India</p>
                <p id="phone">Phone: +91 1234567890</p>
            </div>
            <div class="socials">
                <a href=""#>Facebook</a>
                <a href=""#>Instagram</a>
                <a href=""#>Linked In</a>
                </div>
            </div>
        </div>
    </body>
</html>
