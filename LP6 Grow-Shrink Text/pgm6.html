<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growing and Shrinking Text</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        #text {
            font-weight: bold;
        }

        #ids{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
        }
    </style>
</head>

<body>
    <p id="ids"></p>
    <script>
        const ids=document.getElementById('ids');
        let fs = 5;
        let var1, var2;
        function inTimer()
        {
            ids.innerHTML="TEXT GROWING";
            ids.setAttribute('style',"font-size:"+fs+"px; color: red");
            fs+=5;
            if(fs>=50){
                clearInterval(var1);
                var2= setInterval(deTimer, 1000);
            }
        }
        function deTimer(){
            fs-=5;
            ids.innerHTML="TEXT SHRINKING";
            ids.setAttribute('style',"font-size:"+fs+"px; color: blue");

            if(fs<=5){
                clearInterval(var2);
                var1=setInterval(inTimer, 1000);
            }
        }
        var1= setInterval(inTimer, 1000);
    </script>
</body>
</html>
